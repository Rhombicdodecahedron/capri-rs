name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  release-build:
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p capri
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/capri | Out-Null
          Copy-Item target/release/capri.exe dist/capri/
          Copy-Item -Recurse assets dist/capri/assets
          Copy-Item LICENSE, NOTICE.md, README.md dist/capri/
      - uses: actions/upload-artifact@v4
        with:
          name: capri-windows
          path: dist/capri
