[package]
name = "capri-desktop-windows"
description = "DesktopProbe adapters: Win32 (visible window top edges, taskbar) and a monitors-only fallback."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
capri-application = { workspace = true }
capri-domain = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
