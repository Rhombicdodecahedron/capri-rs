[package]
name = "capri-ui-windows"
description = "Her hands on other apps: Windows UI Automation behind the `UiDriver` port (snapshots, locators, clicks, keys)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
capri-application = { workspace = true }
capri-domain = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
uiautomation = { version = "0.25", default-features = false, features = ["input", "pattern", "control"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
