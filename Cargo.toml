[workspace]
resolver = "3"
members = [
    "crates/capri-domain",
    "crates/capri-application",
    "crates/capri-config",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/Rhombicdodecahedron/capri-rs"

[workspace.dependencies]
capri-domain = { path = "crates/capri-domain" }
capri-application = { path = "crates/capri-application" }
capri-config = { path = "crates/capri-config" }

anyhow = "1"
async-trait = "0.1"
thiserror = "2"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.32", features = ["bundled"] }
winit = "0.30"
softbuffer = "0.4"
tiny-skia = "0.11"
ab_glyph = "0.2"
directories = "5"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
many_single_char_names = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
missing_errors_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"

# image decoding and scaling are painfully slow unoptimised: keep dependencies fast in dev builds
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
